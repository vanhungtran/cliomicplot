articles:
  - title: "Part I — Graphic Grammar and Design System"
    desc: "Core grammar, layer composition, journal typography, trim sizing, and SciFig quality assurance."
    contents:
      - cliomicplot
      - themes-palettes
      - journal-plots
  - title: "Part II — Clinical Trials and Survival Analysis"
    desc: "Time-to-event milestones, multivariable forest plots, RECIST tumor waterfall, swimmer timelines, and MCID effect sizes."
    contents:
      - oncology
  - title: "Part III — High-Dimensional Omics Visualizations"
    desc: "Differential expression, multi-contrast volcano plots, translational proteomics, pathway enrichment, microbial GWAS, and dyad strain sharing."
    contents:
      - volcano-plot
      - multiomics
      - microbiome-mgwas
  - title: "Part IV — Systems Biology and Coupled Multi-Network Architectures"
    desc: "Cross-condition network modularity, topological layout styles, coupled environmental heatmaps, module preservation, and permutation testing."
    contents:
      - coupled-networks
  - title: "Part V — Publication Composites and Applied Case Studies"
    desc: "Complete translational case studies in atopic dermatitis and immuno-oncology, and published paper reproductions."
    contents:
      - case-study-atopic-dermatitis
      - case-study-cancer-immunotherapy
      - recreate-paper
