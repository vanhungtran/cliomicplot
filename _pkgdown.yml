url: https://vanhungtran.github.io/cliomicplot

template:
  bootstrap: 5
  bslib:
    primary: "#0073C2"

home:
  title: Publication-ready clinical & multi-omics visualizations
  description: >
    A ggplot2-based grammar for clinical and omics figures — volcano, forest,
    Kaplan-Meier, waterfall, swimmer, MCID dumbbell, trajectory, heatmap, PCA, ROC,
    GSEA and 55+ more, with Nature/Cell/Science themes and curated palettes.

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]

reference:
  - title: Core engine
    desc: The main plotting function and layer helpers.
    contents:
      - cliplot
      - cliplot_add
      - cliplot_interactive
      - cli_markdown
  - title: Themes & parameters
    contents:
      - clitheme
      - starts_with("theme_cli_")
      - clipar
      - has_concept("theme")
      - starts_with("clitheme_")
  - title: Publication helpers
    contents:
      - cli_panel_label
      - cli_legend_out
      - cli_save
      - cli_journal_size
  - title: Palettes
    contents:
      - cli_palette_list
      - cli_palette_show
      - palette_scale
      - gradient_pal
  - title: Clinical plot types
    contents:
      - type_volcano
      - type_forest
      - type_km
      - type_waterfall
      - type_swimmer
      - type_mcid
      - type_trajectory
  - title: Omics plot types
    contents:
      - type_heatmap
      - type_pca
      - type_ma
      - type_correlation
      - type_boxplot
      - type_violin
      - type_bubble_heatmap
  - title: General plot types
    contents:
      - starts_with("type_")

articles:
  - title: Getting Started
    contents:
      - cliomicplot
      - themes-palettes
  - title: Nature / Cell / Science Figure Styles
    contents:
      - journal-plots
      - oncology
  - title: Multi-Omics Workflows
    contents:
      - multiomics
      - volcano-plot
  - title: Published Paper Re-creations
    contents:
      - recreate-paper
      - recreate-spamtp
